name: n8n

services:
  n8n:
    image: n8nio/n8n:2.34.6
    container_name: n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: n8n.unlockedacademy.co
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.unlockedacademy.co
      N8N_EDITOR_BASE_URL: https://n8n.unlockedacademy.co
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Run scripts/up.sh so the key is injected from 1Password.}
      EXECUTIONS_DATA_PRUNE: "true"
      # Source data held 4.72 GB after a 168 h/20k prune.  Measured retention
      # for the 1.2 GB volume target is 24 h and 2,000 completed executions.
      EXECUTIONS_DATA_MAX_AGE: "24"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "2000"
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5678/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  n8n_data:
    name: n8n_data
    external: true
